<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password · EverCrop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&family=Inter:wght@400;500;600&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="auth">
    <aside class="auth-side">
      <a href="index.html" class="logo"><span class="logo-mark"><i data-i="sprout"></i></span>EverCrop</a>
      <div class="quote">
        <h2 class="h-lg">It happens. <em class="serif">We've got you.</em></h2>
        <p>Enter your email and we'll send a link to set a new password.</p>
      </div>
      <p class="muted" style="font-size:13px">A SoLeaf product · Singapore</p>
    </aside>

    <main class="auth-main">
      <form class="auth-form" data-form="forgot" novalidate>
        <header>
          <h1>Reset password</h1>
          <p class="muted">We'll email you a reset link.</p>
        </header>
        <div class="form-note" data-note role="status" hidden></div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
          <span class="err"></span>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Send reset link</button>
        <p class="auth-foot"><a href="login.html">← Back to log in</a></p>
      </form>
    </main>
  </div>
  <script src="site.js"></script>
  <script src="auth.js"></script>
</body>
</html>
