<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · EverCrop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&family=Inter:wght@400;500;600&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="auth">
    <aside class="auth-side">
      <a href="index.html" class="logo"><span class="logo-mark"><i data-i="sprout"></i></span>EverCrop</a>
      <div class="quote">
        <h2 class="h-lg">Welcome <em class="serif">back.</em></h2>
        <p>Farms: check today's orders and stock. Shoppers: water your tree and reorder your favourites.</p>
      </div>
      <p class="muted" style="font-size:13px">A SoLeaf product · Singapore</p>
    </aside>

    <main class="auth-main">
      <form class="auth-form" data-form="login" novalidate>
        <header>
          <h1>Log in</h1>
          <p class="muted">One login for farms and shoppers.</p>
        </header>
        <div class="form-note" data-note role="status" hidden></div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
          <span class="err"></span>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="pw-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="button" data-toggle-pw aria-label="Show password" aria-pressed="false">Show</button>
          </div>
          <span class="err"></span>
        </div>
        <div class="row-between">
          <label class="check"><input type="checkbox" name="remember"> Remember me</label>
          <a href="forgot-password.html">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Log in</button>
        <p class="auth-foot">New to EverCrop? <a href="register.html">Create an account</a></p>
        <p class="auth-foot" style="font-size:13px;color:var(--subtle)">Prototype: demo accounts are listed in the README.</p>
      </form>
    </main>
  </div>
  <script src="site.js"></script>
  <script src="auth.js"></script>
</body>
</html>
